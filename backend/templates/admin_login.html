{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{% static 'assets/img/logo.png' %}?v=20260517" />
    <title>CampusHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'components/css/admin_login.css' %}?v=20260520-6" />
</head>

<body>
    <main class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">

            <!-- Left Section -->
            <div class="col-lg-8 d-none d-lg-flex flex-column justify-content-center h-100 position-relative p-5 overflow-hidden"
                style="background-color: #1A1851;">

                <!-- Header Logo (Left Side) -->
                <div class="position-absolute d-flex align-items-center gap-0"
                    style="top: 40px; left: 40px; z-index: 2;">
                    <img src="{% static 'assets/img/logo.png' %}" alt="CampusHub Logo"
                        style="height: 50px; object-fit: contain;" />
                    <h4 class="fw-bold mb-0" style="letter-spacing: 0.8px; font-size: 1.6rem; margin-left: -8px;">
                        <span style="color: #FCB316;">Campus</span><span style="color: #ffffff;">Hub</span>
                    </h4>
                </div>

                <!-- Yellow glow top left -->
                <div class="position-absolute"
                    style="width: 600px; height: 600px; background: radial-gradient(circle, rgba(252,179,22,0.2) 0%, rgba(252,179,22,0) 70%); top: -200px; left: -200px; z-index: 0; pointer-events: none;">
                </div>

                <!-- White glow bottom right -->
                <div class="position-absolute"
                    style="width: 500px; height: 500px; background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%); bottom: -200px; right: -200px; z-index: 0; pointer-events: none;">
                </div>

                <div style="max-width: 600px; margin-left: 10%; position: relative; z-index: 1;">
                    <h1 class="text-white fw-bold" style="font-size: 4rem; line-height: 1.2; letter-spacing: -0.02em;">
                        Your <span style="color: #FCB316;">Campus</span><br>
                        Essentials,<br>
                        <span
                            style="background-color: #FCB316; color: #1A1851; padding: 4px 20px; border-radius: 16px; display: inline-block; margin-top: 8px;">Simplified.</span>
                    </h1>
                    <p class="mt-4" style="color: rgba(255,255,255,0.7); font-size: 1.25rem; max-width: 450px;">
                        Access everything you need for campus life in one place.
                    </p>
                </div>
            </div>

            <!-- Right Section-->
            <div class="col-lg-4 d-flex align-items-center justify-content-center bg-white h-100 p-4">
                <!-- Login Form -->
                <div class="card login-card shadow-none border-0">
                    <div class="card-body login-card-body">

                        <h2 class="text-center fw-bold login-title" style="color:#1A1851;">Login</h2>

                        <form id="adminLoginForm" data-login-url="{% url 'admin_login' %}"
                            data-redirect-url="{% url 'admin_dashboard_page' %}" novalidate>

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label fw-medium">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <svg width="16" height="16" viewBox="0 0 24 24"
                                            fill="none" stroke="currentColor"
                                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                            <circle cx="12" cy="7" r="4" />
                                        </svg>
                                    </span>
                                    <input id="username" name="username" type="text" class="form-control border-start-0"
                                        placeholder="Username" required />
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-1">
                                <label for="password" class="form-label fw-medium">Password</label>
                                <div class="input-group password-input-group">
                                    <span class="input-group-text bg-white border-end-0">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <rect x="3" y="11" width="18" height="11" rx="2" />
                                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                        </svg>
                                    </span>
                                    <input id="password" name="password" type="password"
                                        class="form-control border-start-0 password-input" placeholder="Password" required />
                                    <button type="button" class="password-toggle-btn" id="togglePassword"
                                        aria-label="Show password" aria-pressed="false"
                                        onclick="toggleAdminPasswordVisibility()">
                                        <span id="eyeOpen">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                stroke-linejoin="round">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                                <circle cx="12" cy="12" r="3" />
                                            </svg>
                                        </span>
                                        <span id="eyeClosed" class="d-none">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                stroke-linejoin="round">
                                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                                                <line x1="1" y1="1" x2="23" y2="23" />
                                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                                            </svg>
                                        </span>
                                    </button>
                                </div>
                            </div>

                            <!-- Forgot password -->
                            <div class="mb-3 text-start">
                                <a href="#" class="small text-decoration-none">Forgot password?</a>
                            </div>

                            <!-- Remember me -->
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" />
                                <label class="form-check-label small text-muted" for="rememberMe">Remember Me</label>
                            </div>

                            <!-- Error message -->
                            <div id="errorMessage" class="alert alert-danger d-none py-2 small" role="alert"></div>

                            <!-- Submit -->
                            <button type="submit"
                                class="btn btn-login w-100 fw-semibold d-flex align-items-center justify-content-center gap-2">
                                <span class="login-btn-label">Login</span>
                                <svg class="login-btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 12h14" />
                                    <path d="m12 5 7 7-7 7" />
                                </svg>
                                <span class="login-btn-spinner" aria-hidden="true"></span>
                            </button>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleAdminPasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const togglePassword = document.getElementById('togglePassword');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');

            if (!passwordInput || !togglePassword || !eyeOpen || !eyeClosed) return;

            const shouldShowPassword = passwordInput.type === 'password';
            passwordInput.type = shouldShowPassword ? 'text' : 'password';
            eyeOpen.classList.toggle('d-none', shouldShowPassword);
            eyeClosed.classList.toggle('d-none', !shouldShowPassword);
            togglePassword.setAttribute('aria-pressed', String(shouldShowPassword));
            togglePassword.setAttribute('aria-label', shouldShowPassword ? 'Hide password' : 'Show password');
        }
    </script>
    <script src="{% static 'components/js/admin_login.js' %}?v=20260514-3"></script>
</body>

</html>
